<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portofolio Arla</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
    body{background:#05060b;color:#fff;overflow-x:hidden;}
    a{text-decoration:none;color:inherit;}

    /* NAVBAR */
    nav{
      width:100%;
      padding:18px 8%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:fixed;
      top:0;
      left:0;
      background:rgba(5,6,11,0.85);
      backdrop-filter:blur(10px);
      z-index:999;
    }
    nav .logo{font-size:22px;font-weight:700;color:#b47cff;}
    nav ul{display:flex;gap:28px;list-style:none;}
    nav ul li a{font-weight:500;transition:.3s;}
    nav ul li a:hover{color:#b47cff;}

    /* HERO */
    .hero{
      min-height:100vh;
      display:flex;
      align-items:center;
      padding:120px 8% 60px;
      background:radial-gradient(circle at top,#0d0f1a,#05060b);
    }    
    .hero-wrapper{
      display:flex;
      align-items:center;
      justify-content:space-between;
      width:100%;
      gap:60px;
    }
    .hero-content{max-width:650px;}
    .hero h1{font-size:48px;line-height:1.2;margin-bottom:20px;}
    .hero h1 span{color:#b47cff;}
    .hero p{color:#cfcfe6;margin-bottom:35px;}
    .hero .btn{
      display:inline-block;
      padding:14px 36px;
      border-radius:30px;
      background:linear-gradient(135deg,#7f5cff,#b47cff);
      font-weight:600;
      box-shadow:0 0 25px rgba(180,124,255,.4);
    }    

    .hero-image{
      width:380px;
      height:380px;
      border-radius:50%;
      overflow:hidden;
      border:6px solid #b47cff;
      box-shadow:0 0 40px rgba(180,124,255,0.5);
      flex-shrink:0;
    }
    .hero-image img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    /* SECTION */
    section{padding:100px 8%;}
    .section-title{text-align:center;margin-bottom:60px;}
    .section-title h2{font-size:42px;color:#b47cff;}
    .section-title p{color:#cfcfe6;margin-top:10px;}

    /* PROJECTS */
    .projects-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:30px;
    }
    .project-card{
      background:#151b2a;
      border-radius:18px;
      padding:30px;
      transition:.4s;
      border:1px solid rgba(255,255,255,.05);
    }    
    .project-card:hover{
      transform:translateY(-8px);
      box-shadow:0 0 30px rgba(180,124,255,.35);
      border:1px solid rgba(180,124,255,.4);
    }    
    .project-card h3{margin-bottom:10px;color:#fff;}
    .project-card span{color:#b47cff;font-size:14px;}
    .project-card p{margin-top:12px;color:#cfcfe6;font-size:14px;line-height:1.6;}

    /* SKILLS */
    .skills-section{
      background:radial-gradient(circle at top,#0d0f1a,#05060b);
      padding:100px 8%;
      text-align:center;
    }
    .skills-title{
      font-size:42px;
      font-weight:700;
      color:#b47cff;
      margin-bottom:60px;
    }
    .skills-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:25px;
    }
    .skill-card{
      background:#151b2a;
      border-radius:16px;
      padding:30px 15px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:130px;
      transition:.4s;
      border:1px solid rgba(255,255,255,0.05);
      cursor:pointer;
    }    
    .skill-card span{font-size:30px;margin-bottom:10px;}
    .skill-card p{color:#eaeaff;font-size:15px;font-weight:500;text-align:center;}
    .skill-card:hover{
      transform:translateY(-6px) scale(1.03);
      box-shadow:0 0 25px rgba(180,124,255,0.35);
      border:1px solid rgba(180,124,255,0.5);
    }    

    /* CONTACT */
    .contact-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:25px;
      max-width:900px;
      margin:0 auto;
    }
    .contact-card{
      background:linear-gradient(145deg,#151b2a,#0d1220);
      border-radius:20px;
      padding:30px 20px;
      text-align:center;
      transition:.4s;
      border:1px solid rgba(255,255,255,.06);
    }
    .contact-card:hover{
      transform:translateY(-8px);
      box-shadow:0 0 30px rgba(180,124,255,.4);
      border:1px solid rgba(180,124,255,.5);
    } 
    .contact-icon{font-size:34px;margin-bottom:12px;}
    .contact-card h3{margin-bottom:8px;}
    .contact-card a{color:#cfcfe6;font-size:14px;transition:.3s;word-break:break-all;}
    .contact-card a:hover{color:#b47cff;}

    /* FOOTER */
    footer{
      text-align:center;
      padding:35px 15px;
      background:#05060b;
      color:#aaa;
      font-size:13px;
    }

    /* ================= RESPONSIVE ================= */

    /* Tablet */
    @media(max-width:1024px){
      .hero-wrapper{
        flex-direction:column;
        text-align:center;
      }

      .hero-image{
        width:300px;
        height:300px;
        margin-top:30px;
      }

      .projects-grid{grid-template-columns:1fr;}
      .skills-grid{grid-template-columns:repeat(2,1fr);}
      .contact-grid{grid-template-columns:repeat(2,1fr);}
    }

    /* HP */
    @media(max-width:600px){
      nav{
        padding:15px 6%;
      }

      nav ul{
        gap:14px;
        font-size:13px;
      }

      .hero{
        padding:110px 6% 40px;
      }

      .hero h1{
        font-size:32px;
      }

      .hero p{
        font-size:14px;
      }

      .hero-image{
        width:230px;
        height:230px;
      }

      section{
        padding:80px 6%;
      }

      .section-title h2{
        font-size:30px;
      }

      .projects-grid{grid-template-columns:1fr;}
      .skills-grid{grid-template-columns:1fr;}
      .contact-grid{grid-template-columns:1fr;}

      .skills-title{
        font-size:30px;
      }

      footer{
        font-size:12px;
      }
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav>
  <div class="logo">ArlaPorto</div>
  <ul>
    <li><a href="#home">Beranda</a></li>
    <li><a href="#projects">Proyek</a></li>
    <li><a href="#experience">Pengalaman</a></li>
    <li><a href="#skills">Keahlian</a></li>
    <li><a href="#contact">Kontak</a></li>
  </ul>
</nav>

<!-- HERO -->
<section class="hero" id="home">
  <div class="hero-wrapper">
    <div class="hero-content">
      <h1>Halo, saya <span>Arla</span><br>UI/UX Designer & Web Developer</h1>
      <p>Fokus pada pengembangan sistem digital, desain UI/UX modern, dan website profesional berbasis teknologi.</p>
      <a href="#projects" class="btn">Lihat Portofolio</a>
    </div>

    <div class="hero-image">
      <img src="profile.jpeg" alt="Foto Profil Arla">
    </div>
  </div>
</section>

</body>
</html>
